name: Backend tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./ci-test.db
      SECRET_KEY: ci-only-test-secret-for-github-actions
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check frontend JavaScript syntax
        run: node --check ../frontend/app.js
      - name: Verify database migrations
        run: alembic upgrade head
      - name: Import official curriculum seed files
        run: |
          python -m app.cli.import_curriculum ../data/curriculum/4-sosyal-bilgiler-meb-2018.json
          python -m app.cli.import_curriculum ../data/curriculum/4-matematik-meb-2018.json
          python -m app.cli.import_curriculum ../data/curriculum/4-fen-bilimleri-meb-2018.json
          python -m app.cli.import_curriculum ../data/curriculum/4-turkce-meb-2019.json
          python -m app.cli.import_curriculum ../data/curriculum/4-ingilizce-meb-2018.json
          python -m app.cli.import_curriculum ../data/curriculum/4-dkab-meb-2018.json
          python -m app.cli.import_curriculum ../data/curriculum/5-matematik-tymm-2024.json
          python -m app.cli.import_curriculum ../data/curriculum/5-sosyal-bilgiler-tymm-2024.json
          python -m app.cli.import_curriculum ../data/curriculum/5-fen-bilimleri-tymm-2024.json
          python -m app.cli.import_curriculum ../data/curriculum/5-turkce-tymm-2024.json
          python -m app.cli.import_curriculum ../data/curriculum/5-ingilizce-tymm-2025.json
          python -m app.cli.import_curriculum ../data/curriculum/5-dkab-tymm-2026.json
      - name: Run tests
        run: pytest -q
