name: Backend tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./ci-test.db
      SECRET_KEY: ci-only-test-secret-for-github-actions
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check frontend JavaScript syntax
        run: node --check ../frontend/app.js
      - name: Build hardened Docker image
        run: docker build -f ../backend/Dockerfile -t akilli-sinav:ci ..
      - name: Validate Docker Compose configuration
        run: |
          cp ../.env.example ../.env
          docker compose -f ../docker-compose.yml --env-file ../.env.example config >/dev/null
      - name: Verify database migrations
        run: alembic upgrade head
      - name: Import all official curriculum seed files
        run: python -m app.cli.import_all_curriculum
      - name: Run tests
        run: pytest -q

  postgres:
    name: Backend tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sinav_user
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_DB: akilli_sinav
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sinav_user -d akilli_sinav"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sinav_user:ci-only-postgres-password@localhost:5432/akilli_sinav
      SECRET_KEY: ci-only-test-secret-for-github-actions
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify migrations match models on PostgreSQL
        run: |
          alembic upgrade head
          alembic check
      - name: Run tests (curriculum is auto-imported by the app itself)
        run: pytest -q

  frontend:
    name: Frontend DOM tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --check app.js
      - run: npm test
