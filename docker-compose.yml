services:
  db:
    image: postgres:16-alpine
    container_name: akilli-sinav-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: akilli_sinav
      POSTGRES_USER: sinav_user
      POSTGRES_PASSWORD: change_me_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinav_user -d akilli_sinav"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: akilli-sinav-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://sinav_user:change_me_local_only@db:5432/akilli_sinav
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
